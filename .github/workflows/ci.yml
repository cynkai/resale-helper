name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 브라우저 확장(타입·테스트·빌드)
        run: pnpm ext:typecheck && pnpm ext:test && pnpm ext:build
      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium
      - name: 핵심 사용자 흐름(E2E)
        run: pnpm test:e2e
