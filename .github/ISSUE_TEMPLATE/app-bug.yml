name: 앱 버그
description: 로컬 앱에서 계산이 틀리거나, 화면이 깨지거나, 저장·내보내기가 잘못될 때
title: "[앱] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        가능하면 **데모 모드**(화면 맨 아래 "가상 데이터로 둘러보기")에서 재현하고 캡처해 주세요. 내 실제 물건·가격 자료를 공개 이슈에 올릴 필요가 없습니다.
        보안 취약점은 이 양식 대신 Security 탭의 비공개 제보를 이용해 주세요.
  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 확인 (필수)
      options:
        - label: 가져오기 토큰, 판매자 닉네임·연락처·프로필·채팅, 내 메모를 적지 않았고, 화면 캡처를 붙인다면 그 부분을 가렸습니다.
          required: true
  - type: input
    id: screen
    attributes:
      label: 문제가 생긴 화면
      placeholder: "예: 물건 상세(/items/…), 물건 배분(/triage), 설정"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 누른 버튼과 입력한 값을 순서대로 적어 주세요. 금액은 예시 값으로 바꿔도 됩니다.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 저장소 폴더에서 `git rev-parse --short HEAD` 결과
      placeholder: "예: 9403020"
  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: "예: Node 22.13.0, pnpm 11, macOS 15, Chrome 142"
    validations:
      required: true
